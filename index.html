<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boom Real-Scanner</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        :root { --bg: #0d1117; --green: #00c853; --accent: #2f363d; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; text-align: center; }
        #scanner-container { position: relative; width: 100%; max-width: 500px; margin: auto; }
        video { width: 100%; border-bottom: 2px solid var(--green); }
        .overlay-line { position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: rgba(0, 200, 83, 0.5); box-shadow: 0 0 10px var(--green); }
        .btn-main { background: var(--green); border: none; padding: 20px; width: 80%; color: black; font-weight: bold; border-radius: 10px; margin: 20px 0; cursor: pointer; }
        #results { display: none; padding: 20px; }
        .card { background: var(--accent); padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid var(--green); text-align: left; }
        canvas { display: none; } /* Para procesar la imagen internamente */
    </style>
</head>
<body>

    <h2>BOOM SCANNER AI</h2>
    <div id="scanner-container">
        <video id="video" autoplay playsinline></video>
        <div class="overlay-line"></div>
    </div>

    <canvas id="canvas"></canvas>
    <button class="btn-main" id="snap">ESCANEAR PRECIO REAL</button>

    <div id="results">
        <h3 id="detected-price">Buscando precio...</h3>
        <div id="entry-list"></div>
        <button onclick="location.reload()" style="background:none; color:gray; border:1px solid gray; padding:10px; border-radius:5px;">Nueva captura</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
